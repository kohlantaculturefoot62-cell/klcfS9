<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion KLCF</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-container { max-width: 400px; margin: 100px auto; padding: 20px; background: white; text-align: center; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
    .login-btn { width: 95%; margin-top: 15px; }
  </style>
</head>
<body class="bg-light">

  <div class="login-container">
    <h2 style="color: #ffcc00; margin-bottom: 20px;">Accès Candidat S9</h2>
    <input type="text" id="username" placeholder="Nom du candidat" required>
    <input type="password" id="password" placeholder="Mot de passe" required>
    <button class="login-btn" onclick="seConnecter()">Se connecter</button>
    <p id="error-msg" style="color: red; margin-top: 15px;"></p>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzn8CWZKpacH6P-3n9Ew79epzHWHukCSGHeSuSnYAHlpS4nIEDmr7jFEkY072L6xRwNEQ/exec"; 

    // Vérification de la connexion automatique dès le chargement de la page
    document.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("joueur_connecte")) {
        window.location.href = "espace_candidat.html";
      }
    });

    async function seConnecter() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-msg");
      
      errorMsg.innerText = "Connexion en cours...";
      
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "login",
            username: user,
            password: pass
          })
        });

        const result = await response.json();
        
        if (result.status === "success") {
          // Sauvegarde persistante dans localStorage
          localStorage.setItem("joueur_connecte", result.candidat);
          localStorage.setItem("equipe_joueur", result.equipe);
          localStorage.setItem("binome_joueur", result.binome);
          localStorage.setItem("est_capitaine", result.estCapitaine);
          localStorage.setItem("liste_coequipiers", JSON.stringify(result.coequipiers || []));
          localStorage.setItem("solde_binome", result.soldeBinome);
          localStorage.setItem("solde_equipe", result.soldeEquipe);
          
          window.location.href = "espace_candidat.html";
        } else {
          errorMsg.innerText = result.message;
        }
      } catch (error) {
        console.error("Erreur connexion:", error);
        errorMsg.innerText = "Erreur de connexion au serveur.";
      }
    }
  </script>
</body>
</html>
