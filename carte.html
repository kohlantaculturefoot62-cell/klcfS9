<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte Interactive - KLCF S9</title>
  
  <!-- Intégration de Leaflet (Moteur de carte) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Le conteneur de la carte prendra 80% de la hauteur de l'écran */
    #map { 
      height: 80vh; 
      width: 100%; 
      background: #1a1a1a; /* Fond noir derrière la carte */
      border-radius: 8px;
      border: 2px solid #ffcc00;
    }
  </style>
</head>
<body class="bg-light">

  <header class="banner">
    <div class="banner-content">
      <h1 class="logo">KLCF S9 - Exploration</h1>
      <button class="login-btn" onclick="window.location.href='index.html'">Retour à l'accueil</button>
    </div>
  </header>

  <main class="section-container" style="max-width: 1200px;">
    <h2 style="margin-bottom: 10px;">Carte de l'Île</h2>
    <p style="margin-bottom: 20px;">Utilisez la molette de la souris ou vos doigts (sur mobile) pour zoomer. <strong>Cliquez sur une zone pour afficher les coordonnées exactes de la case (A à Z, 1 à 300).</strong></p>
    
    <div id="map"></div>
  </main>

  <script>
    // 1. Initialisation de la carte
    var map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -1,
      maxZoom: 3
    });

    // 2. Définition des dimensions logiques de la GRILLE
    var numCols = 300; // X (Largeur de 1 à 300)
    var numRows = 26;  // Y (Hauteur de A à Z)

    // 3. Définition de la taille VISUELLE de la carte (Format 16:9 très large pour remplir l'écran)
    var mapWidth = 1600;  
    var mapHeight = 900; 
    var bounds = [[0, 0], [mapHeight, mapWidth]];

    // 4. Importation de l'image de l'île
    var imgUrl = 'https://images.unsplash.com/photo-1559128010-7c1ad6e1b6a5?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80';
    L.imageOverlay(imgUrl, bounds).addTo(map);
    map.fitBounds(bounds); 

    // 5. Dessiner le quadrillage (Transparent)
    // Lignes verticales (1 à 300) -> On en dessine une sur 10 pour ne pas saturer l'écran
    for (let i = 0; i <= numCols; i++) {
      let x = (i / numCols) * mapWidth;
      if (i % 10 === 0) {
          L.polyline([[0, x], [mapHeight, x]], {color: 'rgba(255, 255, 255, 0.2)', weight: 1}).addTo(map);
      }
    }
    // Lignes horizontales (A à Z) -> Il n'y en a que 26, on les dessine toutes
    for (let j = 0; j <= numRows; j++) {
      let y = (j / numRows) * mapHeight;
      L.polyline([[y, 0], [y, mapWidth]], {color: 'rgba(255, 255, 255, 0.2)', weight: 1}).addTo(map);
    }

    // 6. Interactivité : Révéler la case au clic
    map.on('click', function(e) {
      var clickedX = e.latlng.lng;
      var clickedY = e.latlng.lat;
      
      // Calculer l'index
      var colIndex = Math.floor((clickedX / mapWidth) * numCols); // 0 à 299
      var rowIndex = Math.floor(((mapHeight - clickedY) / mapHeight) * numRows); // 0 à 25
      
      // Sécurité : On vérifie qu'on est bien sur l'image
      if(colIndex >= 0 && colIndex < numCols && rowIndex >= 0 && rowIndex < numRows) {
         
         // Transformation en A-Z
         var letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
         var rowLetter = letters[rowIndex];
         
         // Transformation en 1-300
         var colNum = colIndex + 1; 
         
         // Afficher l'infobulle
         L.popup()
          .setLatLng(e.latlng)
          .setContent("<div style='font-size:16px; text-align:center;'>Case<br><strong style='font-size:24px; color:#d93025;'>" + rowLetter + colNum + "</strong></div>")
          .openOn(map);
      }
    });
  </script>
</body>
</html>
